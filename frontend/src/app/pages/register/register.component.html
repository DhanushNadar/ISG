<div class="auth-wrapper">
  <div class="clinical-card auth-card">
    <div class="auth-header">
      <h2>Create Account</h2>
      <p>Register a new facility or staff account</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Institutional Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control" placeholder="registry@hospital.com">
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required class="form-control" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="role">Account Type</label>
        <select id="role" name="role" [(ngModel)]="role" class="form-control">
          <option value="HOSPITAL">Hospital Facility</option>
          <option value="PATIENT">Patient Viewer</option>
        </select>
      </div>

      <div class="form-group" *ngIf="role === 'HOSPITAL'">
        <label for="hospital">Select Your Associated Hospital</label>
        <select id="hospital" name="hospital" [(ngModel)]="hospitalId" class="form-control" required>
          <option [ngValue]="null" disabled selected>-- Select a Hospital --</option>
          <option *ngFor="let h of hospitals" [value]="h.id">{{ h.name }} ({{ h.location }})</option>
        </select>
      </div>

      <button type="submit" class="btn-primary w-100" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
