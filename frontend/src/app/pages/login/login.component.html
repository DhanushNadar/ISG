<div class="auth-wrapper">
  <div class="clinical-card auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Log in to access the BloodBank management system</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control" placeholder="hospital@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary w-100" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register Hospital</a></p>
    </div>
  </div>
</div>
