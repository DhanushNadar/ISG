<div class="auth-wrapper">
  <div class="clinical-card auth-card">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Log in to access the BloodBank management system</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <div class="tabs">
      <button class="tab-btn" [class.active]="loginType === 'HOSPITAL'" (click)="loginType = 'HOSPITAL'; errorMessage = ''">Hospital Login</button>
      <button class="tab-btn" [class.active]="loginType === 'PATIENT'" (click)="loginType = 'PATIENT'; errorMessage = ''">Patient Portal</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form mt-4">
      <!-- Hospital Fields -->
      <ng-container *ngIf="loginType === 'HOSPITAL'">
        <div class="form-group">
          <label for="email">Institutional Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control" placeholder="hospital@example.com">
        </div>
      </ng-container>

      <!-- Patient Fields -->
      <ng-container *ngIf="loginType === 'PATIENT'">
        <div class="form-group">
          <label for="aadhaar">Aadhaar Number</label>
          <input type="text" id="aadhaar" name="aadhaar" [(ngModel)]="aadhaar" required class="form-control" placeholder="12-digit Aadhaar Number" maxlength="12">
        </div>
      </ng-container>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary w-100" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Register Hospital</a></p>
    </div>
  </div>
</div>
