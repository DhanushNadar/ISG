<div class="directory-header">
  <div>
    <h1 class="page-title">Register New Patient</h1>
    <p class="subtitle">Onboard a new blood donor into the clinical system</p>
  </div>
</div>

<div class="clinical-card form-container">
  
  <div *ngIf="error" class="alert-danger mb-4">
    <strong>Registration Failed:</strong> {{ error }}
  </div>

  <form (ngSubmit)="onSubmit()" #patientForm="ngForm">
    
    <div class="form-grid">
      <div class="form-group">
        <label>Aadhaar Number <span class="required">*</span></label>
        <input type="text" name="aadhaarNumber" [(ngModel)]="patient.aadhaarNumber" required pattern="^[2-9]{1}[0-9]{11}$" placeholder="12-digit number" class="form-control">
        <small class="hint">Must be exactly 12 digits, cannot start with 0 or 1.</small>
      </div>

      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="name" [(ngModel)]="patient.name" required placeholder="e.g. John Doe" class="form-control">
      </div>

      <div class="form-group">
        <label>Age <span class="required">*</span></label>
        <input type="number" name="age" [(ngModel)]="patient.age" required min="18" max="100" class="form-control">
      </div>

      <div class="form-group">
        <label>Gender <span class="required">*</span></label>
        <select name="gender" [(ngModel)]="patient.gender" required class="form-control">
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Blood Group <span class="required">*</span></label>
        <select name="bloodGroup" [(ngModel)]="patient.bloodGroup" required class="form-control">
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" [(ngModel)]="patient.phone" placeholder="10-digit number" class="form-control">
      </div>
      <div class="form-group full-width">
        <label>Initial Diagnoses (Hold Ctrl/Cmd to select multiple)</label>
        <select multiple name="selectedDiseases" [(ngModel)]="selectedDiseases" class="form-control mt-1" style="height: 120px;">
          <option *ngFor="let d of diseases" [value]="d.id">{{ d.name }} {{ d.isMajor ? '(MAJOR)' : '' }}</option>
        </select>
        <small class="hint">Leave unselected if the patient is completely healthy.</small>
      </div>
    </div>

    <div class="form-group full-width mt-2">
      <label>Email Address</label>
      <input type="email" name="email" [(ngModel)]="patient.email" placeholder="patient@example.com" class="form-control">
      <small class="hint">Required to receive Emergency Broadcasts.</small>
    </div>

    <div class="form-actions mt-4">
      <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="patientForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Registering...' : 'Complete Registration' }}
      </button>
    </div>

  </form>
</div>
